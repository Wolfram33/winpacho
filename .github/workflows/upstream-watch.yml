# Weekly check whether Apache, PHP, MariaDB, MySQL or Adminer have newer versions than
# the latest release ships. A failed run (GitHub mails it) means: build a new
# release - see the run summary for which component and what to do.
name: Upstream watch

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Compare shipped and upstream versions
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-upstream-versions.ps1 -Repo '${{ github.repository }}'
