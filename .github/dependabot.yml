# Hält die auf Commit-SHA gepinnten GitHub Actions aktuell.
# Dependabot öffnet dafür einmal im Monat einen gesammelten Pull Request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
