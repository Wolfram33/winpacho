#######################################################################
# File name: my.ini - MySQL configuration for winpacho
# MySQL is the bundle's second database engine since 2.4.0 (MariaDB is the
# first). Keeps the localhost binding and the service port marker
# WinpachoController/WinpachoService rely on, and the same development and
# small-business server sizing as the MariaDB my.ini:
# scripts\tune-server-config.ps1 recognises this header and leaves it alone.
########################################################################

[mysql]
default-character-set=utf8mb4
no-auto-rehash

# SERVER SECTION The following options will be read by the MySQL Server.
[mysqld]
#Do not delete next line. Used for setting port when run as service
#{service_port}
bind-address=127.0.0.1
server-id = 1
pid-file=mysql.pid
# Error log in the data folder, where WinpachoController's "error log" menu
# entry looks for it (the engine default would be <computername>.err)
log_error=mysql.err

# No binary log: MySQL 8 writes one by default, but a single server has no
# replica to feed, backups are dumps - and binlogs of a busy app grow by
# gigabytes a month. Remove this line only if you set up replication.
skip-log-bin
# No X Protocol (MySQL Shell / X DevAPI) listener on port 33060: PHP apps use
# the classic protocol on 3306. Set mysqlx=ON to get it back.
mysqlx=OFF

skip-external-locking
key_buffer_size = 32M
max_allowed_packet = 256M
table_open_cache = 4000
table_definition_cache = 2000
sort_buffer_size = 2M
read_buffer_size = 1M
read_rnd_buffer_size = 1M
net_buffer_length = 16K
tmp_table_size = 128M
max_heap_table_size = 128M

# Server load: the 400 Apache worker threads may open as many connections in
# a burst - the default 151 would answer "Too many connections".
max_connections = 500
thread_cache_size = 64

character-set-server=utf8mb4

# Server sizing: the InnoDB buffer pool should hold the hot data set. On a box
# shared with Apache/PHP use 25-50% of RAM (16 GB box: 2G-4G); on a dedicated
# database server up to 70%. 512M is the developer-laptop default.
innodb_buffer_pool_size = 512M
innodb_redo_log_capacity = 256M
innodb_log_buffer_size = 32M
innodb_flush_log_at_trx_commit = 1
innodb_lock_wait_timeout = 50
# Background flushing rate for SSDs (the default 200 dates from spinning disks)
innodb_io_capacity = 1000
innodb_io_capacity_max = 2000

[mysqldump]
quick
max_allowed_packet = 256M

[myisamchk]
key_buffer_size = 8M
sort_buffer_size = 8M
