;#############################################################################
;# File name: us_opt.ini - database engine name for WinpachoController
;# winpacho - database module (template, filled by
;# scripts\package-mariadb-module.ps1 and scripts\package-mysql-module.ps1)
;# Notes: Configure button, pop-ups, and menu windows text.
;#        The bundle ships MariaDB and MySQL (since 2.4.0): the active engine
;#        sits in core\mysql, the other one waits in core\db_standby\<engine>
;#        until the controller's menu entry Switch database engine swaps them.
;#############################################################################
;
;===== USER CONFIGURATION ====================================================
; text          Server Name     MariaDB or MySQL
; version       Major version   e.g 11
; release       Full version    e.g 11.8.3 (shown on the splash page)
;=============================================================================
;
[USER]
;
;--- Server text
text = {TEXT}
version = {MAJOR}
release = {VERSION}
;
